<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malla Curricular - UCN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para la malla */
        
        /* Contenedor principal de la malla (grid) */
        #malla-grid {
            display: flex; /* Cambiado a flex para desplazamiento horizontal */
            flex-direction: row;
            overflow-x: auto; /* Permite scroll horizontal */
            padding: 16px;
            gap: 8px; /* Espacio entre niveles */
            background-color: #f9fafb; /* bg-gray-50 */
            border: 1px solid #e5e7eb; /* border-gray-200 */
            border-radius: 8px;
            min-height: 400px;
        }

        /* Columna para cada nivel */
        .malla-nivel {
            flex: 0 0 200px; /* Ancho fijo para cada nivel, no se encoge */
            display: flex;
            flex-direction: column;
            gap: 8px; /* Espacio entre asignaturas */
            padding: 8px;
            background-color: #ffffff; /* bg-white */
            border-radius: 6px;
            border: 1px solid #d1d5db; /* border-gray-300 */
        }

        /* Cabecera del nivel (Nivel I, Nivel II, etc.) */
        .malla-nivel-header {
            font-weight: 600; /* font-semibold */
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #6b7280; /* border-b-2 border-gray-500 */
            color: #1f2937; /* text-gray-800 */
        }

        /* Tarjeta para cada asignatura */
        .asignatura-card {
            border: 1px solid #d1d5db; /* border-gray-300 */
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* shadow-sm */
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .asignatura-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1); /* shadow-md */
        }

        /* Nombres y códigos */
        .asignatura-nombre {
            font-weight: 600; /* font-semibold */
            font-size: 0.875rem; /* text-sm */
            color: #1f2937; /* text-gray-800 */
        }
        .asignatura-codigo {
            font-size: 0.75rem; /* text-xs */
            color: #6b7280; /* text-gray-500 */
        }
        .asignatura-creditos, .asignatura-prereq {
            font-size: 0.75rem; /* text-xs */
            color: #4b5563; /* text-gray-600 */
            margin-top: 4px;
        }
        .asignatura-prereq {
            color: #b91c1c; /* text-red-700 */
            font-style: italic;
        }
        
        /* --- Estados de Asignatura --- */

        /* Estado por defecto (pendiente) */
        .asignatura-pendiente {
            background-color: #f3f4f6; /* bg-gray-100 */
            border-color: #d1d5db; /* border-gray-300 */
        }
        .asignatura-pendiente .asignatura-nombre {
            color: #374151; /* text-gray-700 */
        }

        /* Estado aprobada */
        .asignatura-aprobada {
            background-color: #dcfce7; /* bg-green-100 */
            border-color: #86efac; /* border-green-300 */
        }
        .asignatura-aprobada .asignatura-nombre {
            color: #15803d; /* text-green-800 */
        }

        /* Estado reprobada (ejemplo) */
        .asignatura-reprobada {
            background-color: #fee2e2; /* bg-red-100 */
            border-color: #fca5a5; /* border-red-300 */
        }
        .asignatura-reprobada .asignatura-nombre {
            color: #b91c1c; /* text-red-700 */
        }

        /* Estado cursando (ejemplo) */
        .asignatura-cursando {
            background-color: #dbeafe; /* bg-blue-100 */
            border-color: #93c5fd; /* border-blue-300 */
        }
        .asignatura-cursando .asignatura-nombre {
            color: #1d4ed8; /* text-blue-800 */
        }

    </style>
</head>
<body class="bg-gray-50 min-h-screen"> 
    <!-- Cabecera (Reutilizada de carrerasUsuario.html) -->
    <header class="grid bg-blue-500 w-full grid-flow-col pb-3 justify-between" id="cabezon">
        <div>
            <img src="/Escudo-UCN-Full-Color.png" alt="Escudo-UCN-Full-Color"
            class="w-10 h-10 mt-2 ml-2">
        </div>
        <div id="saludo-usuario">
            <!-- El saludo se carga por manejoDatos.js -->
        </div>
        <button id="logout" class="cursor-pointer border border-black hover:bg-blue-600 
        rounded-sm text-white mt-3 transition duration-300 px-2 mr-2">
            Cerrar Sesión
        </button>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 id="malla-header" class="text-3xl font-bold text-gray-800 mb-2">Malla Curricular</h1>
            <p class="text-gray-600">Visualización de tu avance académico por nivel.</p>
             <a href="../carreras/carrerasUsuario.html" class="text-blue-600 hover:text-blue-800">&larr; Volver a Mis Carreras</a>
        </div>

        <!-- Estado de Carga -->
        <div id="loading-state" class="flex justify-center items-center py-12">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
            <span class="ml-3 text-gray-600">Cargando datos de malla y avance...</span>
        </div>

        <!-- Estado de Error -->
        <div id="error-state" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
            <strong>Error:</strong> <span id="error-message"></span>
        </div>
        
        <!-- Contenedor para la Malla -->
        <div id="malla-grid-container" class="hidden">
            <div id="malla-grid">
                <!-- Las columnas y asignaturas se generarán aquí dinámicamente -->
            </div>
        </div>
        
        <!-- Contenedor para la Proyección (semestres) -->
        <div id="proyeccion-container" class="hidden mt-8">
            <h2 class="text-2xl font-semibold mb-3">Proyección sugerida (por semestres)</h2>
            <!-- El contenido de la proyección se inyectará aquí -->
        </div>
    </main>

    <!-- Scripts de Lógica -->
    <script type="module" src="../logout.js"></script>
    <script type="module" src="../manejoDatos.js"></script>
    <script type="module" src="mallaCarrera.js"></script>
</body>
</html>
