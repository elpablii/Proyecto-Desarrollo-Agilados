<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de Carrera - UCN (Tolerante)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen"> 
    <header class="grid bg-blue-500 w-full grid-flow-col pb-3 justify-between" id="cabezon">
        <div>
            <img src="/Escudo-UCN-Full-Color.png" alt="Escudo-UCN-Full-Color"
            class="w-10 h-10 mt-2 ml-2">
        </div>

        <div id="saludo-usuario">
            
        </div>
        <button id="logout" class="cursor-pointer border border-black hover:bg-blue-600 
        rounded-sm text-white mt-3 transition duration-300 px-2 mr-2">
            Cerrar Sesión
        </button>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Datos de Carrera (Versión Tolerante)</h1>
            <p class="text-gray-600">Información académica de tu carrera universitaria</p>
            
            <div class="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                <h3 class="font-semibold text-yellow-800 mb-2">Versión Tolerante</h3>
                <p class="text-yellow-700 text-sm">
                    Esta versión es más tolerante a errores de red y no redirige inmediatamente al login.
                </p>
            </div>
        </div>

        <!-- Contenedor para mostrar los datos de carrera -->
        <div id="datos-carrera" class="space-y-4">
            <!-- Los datos se cargarán aquí dinámicamente -->
            <div class="flex justify-center items-center py-12">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                <span class="ml-3 text-gray-600">Cargando datos de carrera...</span>
            </div>
        </div>

        <!-- Botón para recargar datos -->
        <div class="mt-8 text-center">
            <button id="recargar-datos" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition duration-300">
                Recargar Datos
            </button>
        </div>
        
        <!-- Enlaces a otras versiones -->
        <div class="mt-8 text-center space-x-4">
            <a href="carrerasUsuario.html" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded transition duration-300">
                Versión Original
            </a>
            <a href="../../dePrueba.html" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded transition duration-300">
                Página Principal
            </a>
        </div>
    </main>

    <script type="module" src="/frontend/carreras/carrerasUsuario-tolerant.js"></script>
</body>
</html>
