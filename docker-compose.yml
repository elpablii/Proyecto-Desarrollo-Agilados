services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agilados-backend:latest
    container_name: agilados-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      # Persist data (db, sessions, mock fallbacks) in a single volume
      - ./backend/data:/app/data
    networks:
      - agilados_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/auth/status', (r) => process.exit(r.statusCode === 200 || r.statusCode === 401 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agilados-frontend:latest
    container_name: agilados-frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agilados_net

networks:
  agilados_net:
    driver: bridge
